name: CI

on:
  push:
    branches: [main]
  pull_request:

# None of these jobs writes to the repo.
permissions:
  contents: read

# Cancel superseded runs on PR branches; let pushes to main run to completion.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build app (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - name: Cache Swift build
        uses: actions/cache@v6
        with:
          path: |
            app/.build
            ~/Library/Caches/org.swift.swiftpm
          key: swift-${{ runner.os }}-${{ hashFiles('app/Package.swift') }}

      - name: Build release binary
        run: swift build -c release --package-path app

      - name: Run unit tests
        run: swift test --package-path app

      - name: Bundle smoke test
        env:
          VERSION: 0.0.0-ci
        run: scripts/bundle.sh

  lint:
    name: Lint scripts & JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: shellcheck
        run: shellcheck bin/agentbar-hook scripts/*.sh

      - name: Validate JSON
        run: |
          jq empty plugin/hooks/hooks.json
          jq empty plugin/.claude-plugin/plugin.json
          jq empty .claude-plugin/marketplace.json

  plugin:
    name: Validate & test Claude Code mod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Pinned to the release the mod was written and tested against; bump deliberately.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.287

      - name: Validate plugin
        run: claude plugin validate plugin

      - name: Test plugin
        run: claude plugin test plugin

  plugin-version:
    name: Plugin version bumped
    runs-on: ubuntu-latest
    # Claude Code caches an installed plugin by its version, so a change to plugin/ that keeps
    # the old version never reaches anyone who already has it installed.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check plugin and marketplace versions
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          head=$(jq -r .version plugin/.claude-plugin/plugin.json)
          for v in "$(jq -r .metadata.version .claude-plugin/marketplace.json)" \
                   "$(jq -r '.plugins[] | select(.name == "agentbar") | .version' .claude-plugin/marketplace.json)"; do
            if [ "$v" != "$head" ]; then
              echo "::error::marketplace.json says $v but plugin.json says $head; keep them in sync."
              exit 1
            fi
          done
          if git diff --quiet "$BASE" HEAD -- plugin/; then
            echo "plugin/ unchanged"; exit 0
          fi
          base=$(git show "$BASE:plugin/.claude-plugin/plugin.json" | jq -r .version)
          if [ "$base" = "$head" ]; then
            echo "::error::plugin/ changed but its version is still $head. Bump it in plugin/.claude-plugin/plugin.json and .claude-plugin/marketplace.json, or installed copies will never update."
            exit 1
          fi
          echo "plugin version $base -> $head"

  commitlint:
    name: Lint commit messages
    runs-on: ubuntu-latest
    # Only pull requests carry a base/head range to lint. Pushes to main can
    # include the semantic-release "chore(release):" commit, which we skip.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          # Match the release job (semantic-release 25 requires Node >= 22).
          node-version: 22

      - name: Install commitlint
        run: npm ci

      - name: Validate PR commit messages
        run: >
          npx commitlint
          --from "${{ github.event.pull_request.base.sha }}"
          --to "${{ github.event.pull_request.head.sha }}"
          --verbose
